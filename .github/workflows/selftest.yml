name: selftest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: protocol + security regression (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # 为什么要指定 os：ubuntu-latest 现在指向 26.04，setup-python 在那上面
      # 已经拿不到 3.9 的构建（报 "The version '3.9' ... was not found for Ubuntu 26.04"），
      # 所以最低版本放到 22.04 上跑，最新版本继续跑 ubuntu-latest。
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pyserial
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyserial>=3.4"

      # selftest.py 用一个 TCP 假从站冒充 485 总线（socket://127.0.0.1:160xx），
      # 不需要任何真实硬件；端口全部 >= 1501，非 root 也能 bind。
      - name: Protocol self-test (12 checks, no hardware)
        run: python selftest.py

      - name: Security regression (CORS / token / body limit / panel / error leakage)
        run: python sec_test.py
